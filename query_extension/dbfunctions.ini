Create Objects = _myArray = ["OBJ","%ObjectID%","%ClassName%","%CharacterID%",%Worldspace%,%Inventory%,%Hitpoints%,%Fuel%,%Damage%,%StorageCoins%,"%objectname%","%owneruid%"];_objArray set [count _objArray, _myArray];

