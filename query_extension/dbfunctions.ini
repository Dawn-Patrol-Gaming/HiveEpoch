## SERVER INITIALIZATION QUERIES
[getTimezone]
SQL1_1 = SELECT @@GLOBAL.time_zone, @@SESSION.time_zone,now()
SQL1_INPUTS = 0
OUTPUT = 1-STRING,2-STRING,3-STRING

[getServerTime]
SQL1_1 = SELECT DATE_FORMAT(CURRENT_TIMESTAMP, '%Y-%m-%d %l:%i %p')
SQL1_INPUTS = 0
OUTPUT = 1-STRING

[cleanObjects]
SQL1_1 = delete from object_data WHERE (`Datestamp` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 16 DAY)
SQL1_2 = AND `lastupdated` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 16 DAY))
SQL1_3 = OR (damage >= 1);
Number of Inputs = 0
SQL1_INPUTS = 0

[cleanDeadCharacters]
SQL1_1 = delete from character_data WHERE alive = 0
SQL1_2 = AND `lastupdated` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 20 MINUTE);
Number of Inputs = 0
SQL1_INPUTS = 0

[cleanOldCharacters]
SQL1_1 = delete from character_data WHERE `lastupdated` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 90 DAY);
Number of Inputs = 0
SQL1_INPUTS = 0

[cleanPlayers]
SQL1_1 = delete from player_data WHERE `lastupdated` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 365 DAY);
Number of Inputs = 0
SQL1_INPUTS = 0

[cleanLockedSafes]
SQL1_1 = update object_data set characterid = 0 where (classname like '%vault%' or classname like '%tallsafe%') and `lastupdated` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 16 DAY);
Number of Inputs = 0
SQL1_INPUTS = 0

[cleanLockedLockboxes]
SQL1_1 = update object_data set characterid = 10000 where classname like '%lockbox%' and `lastupdated` < DATE_SUB(CURRENT_TIMESTAMP, INTERVAL 16 DAY);
Number of Inputs = 0
SQL1_INPUTS = 0

